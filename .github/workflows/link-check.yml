name: External Link Check
permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  link-check:
    name: Check External URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
      #   with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Check URLs in sources/index.md
        id: url_check
        run: |
          python3 - <<'EOF'
          import re
          import sys
          import requests

          with open("sources/index.md", encoding="utf-8") as fh:
              content = fh.read()

          # Extract bare domains and full https URLs from markdown tables
          url_pattern = re.compile(
              r"https?://[^\s\)\]>\"']+|(?<!\()(?<!\[)([a-z0-9.-]+\.(?:gov\.sa|org\.sa|sa|org|int))\b"
          )
          # Also match bare domains in table cells (e.g. | misa.gov.sa |)
          cell_domain = re.compile(r"\|\s*((?:[a-z0-9-]+\.)+(?:gov\.sa|org\.sa|sa|org|int))\s*\|")

          urls = set()
          for m in url_pattern.finditer(content):
              u = m.group(0)
              if u.startswith("http"):
                  urls.add(u.rstrip(".,)"))
          for m in cell_domain.finditer(content):
              urls.add("https://" + m.group(1))

          if not urls:
              print("No URLs found to check.")
              sys.exit(0)

          failed = []
          for url in sorted(urls):
              try:
                  r = requests.head(url, timeout=10, allow_redirects=True,
                                    headers={"User-Agent": "Mozilla/5.0 invest-gate-ksa link-checker"})
                  status = r.status_code
              except Exception as exc:
                  status = f"ERROR: {exc}"
              if isinstance(status, int) and status >= 400:
                  failed.append(f"{status}  {url}")
                  print(f"FAIL  {status}  {url}")
              else:
                  print(f"OK    {status}  {url}")

          if failed:
              print("\nFailed URLs:")
              for f in failed:
                  print(f"  {f}")
              with open("link_check_failures.txt", "w") as out:
                  out.write("\n".join(failed))
              sys.exit(1)
          else:
              print("\nAll URLs OK.")
          EOF
        continue-on-error: false

